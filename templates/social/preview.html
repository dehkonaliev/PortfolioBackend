<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ url }}" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="MyResume" />
    <meta property="og:type" content="{{ og_type }}" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:image" content="{{ image }}" />
    <meta property="og:url" content="{{ url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="{{ image }}" />
    <link rel="manifest" href="/favicon_light/site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon_light/favicon.ico" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #121212;
        color: #f5f5f5;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      img.avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #d4af37;
        margin-bottom: 20px;
      }
      img.banner {
        width: 100%;
        max-width: 720px;
        max-height: 320px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        color: #b8b8b8;
        max-width: 420px;
        margin: 0;
      }
      .brand {
        margin-top: 28px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #d4af37;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    {% if og_type == 'profile' %}
      <img class="avatar" src="{{ image }}" alt="{{ title }}" />
    {% else %}
      <img class="banner" src="{{ image }}" alt="{{ title }}" />
    {% endif %}
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
    <div class="brand">MyResume</div>
  </body>
</html>
